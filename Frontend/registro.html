<!DOCTYPE html>
<!--
============================================================
  REGISTRO (solo diseno) - AXIS
  ------------------------------------------------------------
  Pantalla para CREAR una cuenta nueva.
  Campos: nombre + apellido + correo + usuario + contrasena.
  (Se quito el "confirmar contrasena" a peticion del usuario.)

  PARA EL COMPANERO DEL BACKEND:
   - El <form id="form-registro"> tiene action="#" y method="post".
     Cambialo por la URL real (ej. action="/registro") o usa fetch().
   - Campos listos:  nombre, apellido, correo, usuario, contrasena
   - #registro-error / #registro-ok para mostrar mensajes.
============================================================
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIS - Crear Cuenta</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <!-- FONDO CON LOS COLORES (naranja, gris, blanco) -->
    <div class="login-contenedor">

        <div class="login-tarjeta">

            <!-- <img src="img/logo.png" alt="Logo" class="login-logo"> -->

            <h1 class="login-titulo">Crear cuenta</h1>
            <p class="login-subtitulo">Registra un nuevo usuario en AXIS</p>

            <!-- Mensajes de error / exito (los llena el backend/JS) -->
            <div class="login-error" id="registro-error"></div>
            <div class="login-ok" id="registro-ok"></div>

            <!-- FORMULARIO DE REGISTRO -->
            <form id="form-registro" method="post" action="#">

                <!-- CAMPO NOMBRE -->
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre"
                       placeholder="Tu nombre" required>

                <!-- CAMPO APELLIDO -->
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido"
                       placeholder="Tu apellido" required>

                <!-- CAMPO CORREO -->
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo"
                       placeholder="ejemplo@correo.com" required>
                <!-- CONTRASENA -->
                <label for="contrasena">Contrasena</label>
                <div class="campo-contrasena">
                    <input type="password" id="contrasena" name="contrasena"
                           placeholder="Crea una contrasena" required>
                    <button type="button" class="ojo" id="ojo">&#128065;</button>
                </div>

                <!-- BOTON REGISTRAR -->
                <button type="submit" class="boton-ingresar">REGISTRARME</button>
            </form>

            <!-- Enlace de regreso al acceso -->
            <p class="login-pie">
                Ya tienes cuenta?
                <a href="login.html">Iniciar sesion</a>
            </p>
        </div>
    </div>

    <script src="js/registro.js"></script>
</body>
</html>
