<!--

============================================================
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIS - Usuario</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/subpaginas.css">
</head>

    <!-- ===== BARRA DE ICONOS (misma en todas las paginas) ===== -->
   <aside class="menu-iconos" id="menu-iconos">

        <!-- BOTON PARA DESPLEGAR / CONTRAER LA BARRA -->

            <span class="icono">&#9776;</span>
            <span class="etiqueta">Menu</span>
        </button>

        
	<a href="dashboard.html" class="icono-item activo">
    	    <span class="icono">
            <img src="img/INICIO.png" alt="Inicio">
    	    </span>

        </a>


        <a href="usuario.html" class="icono-item">
            <span class="icono">
	    <img src="img/USUARIO.png" alt="Usuario">	
	    </span>
            <span class="etiqueta">Usuario</span>
        </a>

        <a href="pronostico.html" class="icono-item">
            <span class="icono">

        <a href="reporte.html" class="icono-item">
            <span class="icono">

        <a href="controles.html" class="icono-item">
            <span class="icono">

        </a>

        <a href="configuracion.html" class="icono-item">
            <span class="icono">

            <span class="etiqueta">Configuracion</span>
        </a>

        <a href="ayuda.html" class="icono-item">
           <span class="icono">
            <img src="img/AYUDA.png" alt="Ayuda">

        </a>


        <a href="dispositivo.html" class="icono-item">
            <span class="icono">

        <a href="actualizaciones.html" class="icono-item">

	    </span>
            <span class="etiqueta">Cerrar</span>
        </a>

        </header>

        <main class="sub-cuerpo">

            <!-- Perfil -->
            <section class="seccion">
                <div class="perfil-cabecera">
                    <div class="perfil-avatar" id="u-inicial">?</div>
                    <div>
                        <p class="perfil-nombre" id="u-nombre">--</p>
                        <p class="perfil-rol" id="u-rol">--</p>
                    </div>
                </div>
                <div class="rejilla">
                    <div class="mini"><p class="mini-etiqueta">Correo</p><p class="mini-valor" id="u-correo">--</p></div>

            <section class="seccion">

                    <div class="mini"><p class="mini-etiqueta">ID del equipo</p><p class="mini-valor" id="u-id-equipo">--</p></div>
                </div>
            </section>

            <!-- Acciones -->
            <section class="seccion">
                <h2 class="seccion-titulo">Cuenta</h2>
                <div class="grupo-botones">
                    <button class="boton-accion">Editar perfil</button>
                    <button class="boton-secundario">Cambiar contrasena</button>
                </div>
            </section>
