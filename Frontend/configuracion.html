    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIS - Configuracion</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/subpaginas.css">
</head>
<body>

    <aside class="menu-iconos" id="menu-iconos">

        <!-- BOTON PARA DESPLEGAR / CONTRAER LA BARRA -->

            <span class="icono">&#9776;</span>
            <span class="etiqueta">Menu</span>
        </button>

        
	<a href="dashboard.html" class="icono-item activo">
    	    <span class="icono">
            <img src="img/INICIO.png" alt="Inicio">
    	    </span>
    	    <span class="etiqueta">Inicio</span>
        </a>


        <a href="usuario.html" class="icono-item">
            <span class="icono">
	    <img src="img/USUARIO.png" alt="Usuario">	
	    </span>
            <span class="etiqueta">Usuario</span>
        </a>

        <a href="pronostico.html" class="icono-item">
            <span class="icono">
            <img src="img/PRONOSTICO.png" alt="Pronostico">
	    </span>
            <span class="etiqueta">Pronostico</span>
        </a>

        <a href="reporte.html" class="icono-item">
            <span class="icono">
	    <img src="img/REPORTE.png" alt="Reporte">
	    </span>
            <span class="etiqueta">Reporte (Datos)</span>
        </a>

        <a href="controles.html" class="icono-item">
            <span class="icono">
            <img src="img/CONTROLES.png" alt="Controles">
	    </span>
            <span class="etiqueta">Controles</span>
        </a>

        <a href="configuracion.html" class="icono-item">
            <span class="icono">
            <img src="img/CONFIGURACION.png" alt="Configuracion">
	    </span>
            <span class="etiqueta">Configuracion</span>
        </a>

        <a href="ayuda.html" class="icono-item">
           <span class="icono">
            <img src="img/AYUDA.png" alt="Ayuda">
	    </span>
            <span class="etiqueta">Ayuda</span>
        </a>


        <a href="dispositivo.html" class="icono-item">
            <span class="icono">
            <img src="img/M_DISPOSITIVO.png" alt="Dispositivo">
	    </span>
            <span class="etiqueta">Dispositivo</span>
        </a>


        <a href="actualizaciones.html" class="icono-item">
           <span class="icono">

        </a>


        <!-- Cerrar sesion (hasta abajo) -->
        <a href="login.html" class="icono-item icono-salir">
            <span class="icono">
            <img src="img/CERRAR_SESION.png" alt="Cerrar">
	    </span>
            <span class="etiqueta">Cerrar</span>
        </a>

    </aside>

    <div class="contenido">
        <header class="sub-cabecera">
            <a href="dashboard.html" class="boton-volver">&#8592; Volver</a>
            <h1 class="sub-titulo"><span class="sub-icono-titulo">&#9881;</span>Configuracion</h1>
        </header>

        <main class="sub-cuerpo">

            <!-- Umbrales -->
            <section class="seccion">
                <h2 class="seccion-titulo">Umbrales del secado</h2>
                <div class="campo-form">
                    <label>Temperatura maxima (&deg;C)</label>
                    <input type="number" id="cfg-temp-max" placeholder="--">
                </div>
                <div class="campo-form">
                    <label>Humedad objetivo (%)</label>
                    <input type="number" id="cfg-hum-objetivo" placeholder="--">
                </div>
                <div class="campo-form">
                    <label>Guardar el riel si llueve</label>
                    <label class="switch"><input type="checkbox" id="cfg-lluvia"><span class="pista"></span></label>
                </div>
            </section>

            <!-- Notificaciones -->
            <section class="seccion">
                <h2 class="seccion-titulo">Notificaciones</h2>
                <div class="campo-form">
                    <label>Avisar cuando termine el secado</label>
                    <label class="switch"><input type="checkbox" id="cfg-notif-fin"><span class="pista"></span></label>
                </div>
                <div class="campo-form">
                    <label>Avisar por alertas (temperatura alta, etc.)</label>
                    <label class="switch"><input type="checkbox" id="cfg-notif-alerta"><span class="pista"></span></label>
                </div>
            </section>

            <!-- Preferencias -->
            <section class="seccion">
                <h2 class="seccion-titulo">Preferencias</h2>
                <div class="campo-form">
                    <label>Idioma</label>
                    <select id="cfg-idioma"><option>Espanol</option><option>English</option></select>
                </div>
                <div class="campo-form">
                    <label>Unidad de temperatura</label>
                    <select id="cfg-unidad"><option>Celsius (&deg;C)</option><option>Fahrenheit (&deg;F)</option></select>
                </div>
                <div class="grupo-botones" style="margin-top:16px;">
                    <button class="boton-accion">Guardar cambios</button>
                </div>
            </section>
        </main>
    </div>

    <script src="js/menu.js"></script>
</body>
</html>
