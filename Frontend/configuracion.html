<!DOCTYPE html>
<!--
============================================================
  SUBPAGINA: CONFIGURACION (solo diseno)
  Umbrales, notificaciones y preferencias. Valores vacios.
  PARA EL BACKEND: guardar/leer estos campos.
============================================================
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIS - Configuracion</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/subpaginas.css">
</head>
<body>

    <aside class="menu-iconos" id="menu-iconos">
        <button class="boton-desplegar" id="boton-desplegar" title="Desplegar menu">
            <span class="icono">&#9776;</span><span class="etiqueta">Menu</span>
        </button>
        <a href="dashboard.html" class="icono-item"><span class="icono">&#127968;</span><span class="etiqueta">Inicio</span></a>
        <a href="usuario.html" class="icono-item"><span class="icono">&#128100;</span><span class="etiqueta">Usuario</span></a>
        <a href="pronostico.html" class="icono-item"><span class="icono">&#127780;</span><span class="etiqueta">Pronostico</span></a>
        <a href="reporte.html" class="icono-item"><span class="icono">&#128202;</span><span class="etiqueta">Reporte (Datos)</span></a>
        <a href="controles.html" class="icono-item"><span class="icono">&#127919;</span><span class="etiqueta">Controles</span></a>
        <a href="configuracion.html" class="icono-item activo"><span class="icono">&#9881;</span><span class="etiqueta">Configuracion</span></a>
        <a href="ayuda.html" class="icono-item"><span class="icono">&#10067;</span><span class="etiqueta">Ayuda</span></a>
        <a href="dispositivo.html" class="icono-item"><span class="icono">&#128241;</span><span class="etiqueta">Mi dispositivo</span></a>
        <a href="actualizaciones.html" class="icono-item"><span class="icono">&#128260;</span><span class="etiqueta">Actualizaciones</span></a>
        <a href="login.html" class="icono-item icono-salir"><span class="icono">&#128682;</span><span class="etiqueta">Cerrar sesion</span></a>
    </aside>

    <div class="contenido">
        <header class="sub-cabecera">
            <a href="dashboard.html" class="boton-volver">&#8592; Volver</a>
            <h1 class="sub-titulo"><span class="sub-icono-titulo">&#9881;</span>Configuracion</h1>
        </header>

        <main class="sub-cuerpo">

            <!-- Umbrales -->
            <section class="seccion">
                <h2 class="seccion-titulo">Umbrales del secado</h2>
                <div class="campo-form">
                    <label>Temperatura maxima (&deg;C)</label>
                    <input type="number" id="cfg-temp-max" placeholder="--">
                </div>
                <div class="campo-form">
                    <label>Humedad objetivo (%)</label>
                    <input type="number" id="cfg-hum-objetivo" placeholder="--">
                </div>
                <div class="campo-form">
                    <label>Guardar el riel si llueve</label>
                    <label class="switch"><input type="checkbox" id="cfg-lluvia"><span class="pista"></span></label>
                </div>
            </section>

            <!-- Notificaciones -->
            <section class="seccion">
                <h2 class="seccion-titulo">Notificaciones</h2>
                <div class="campo-form">
                    <label>Avisar cuando termine el secado</label>
                    <label class="switch"><input type="checkbox" id="cfg-notif-fin"><span class="pista"></span></label>
                </div>
                <div class="campo-form">
                    <label>Avisar por alertas (temperatura alta, etc.)</label>
                    <label class="switch"><input type="checkbox" id="cfg-notif-alerta"><span class="pista"></span></label>
                </div>
            </section>

            <!-- Preferencias -->
            <section class="seccion">
                <h2 class="seccion-titulo">Preferencias</h2>
                <div class="campo-form">
                    <label>Idioma</label>
                    <select id="cfg-idioma"><option>Espanol</option><option>English</option></select>
                </div>
                <div class="campo-form">
                    <label>Unidad de temperatura</label>
                    <select id="cfg-unidad"><option>Celsius (&deg;C)</option><option>Fahrenheit (&deg;F)</option></select>
                </div>
                <div class="grupo-botones" style="margin-top:16px;">
                    <button class="boton-accion">Guardar cambios</button>
                </div>
            </section>
        </main>
    </div>

    <script src="js/menu.js"></script>
</body>
</html>
